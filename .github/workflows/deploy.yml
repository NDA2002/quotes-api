name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          $IMAGE = ("${{ secrets.DOCKER_USERNAME }}/quotes-api:${{ github.sha }}").ToLower()
          "DOCKER_IMAGE=$IMAGE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t $env:DOCKER_IMAGE .

      - name: Push image
        run: docker push $env:DOCKER_IMAGE

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kub8s/quotes-deployment.yaml
          kubectl set image deployment/quotes-api quotes-api=$env:DOCKER_IMAGE
          kubectl rollout status deployment/quotes-api